<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tangy — Wood-fired Pizza &amp; Artisan Ice Cream</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Order wood-fired pizzas and small-batch ice cream from Tangy.">
  <meta name="theme-color" content="#e23744">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Applied before first paint so a dark-theme reload never flashes white.
    (function () {
      try {
        var stored = localStorage.getItem('tangy.theme');
        var dark = stored === 'dark' || ((!stored || stored === 'system') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
